[project]
name = "bine-backend"
version = "0.1.0"
description = "BINE: Pre-trade guard for tokenized stocks on BSC"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # async SQLite driver
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",           # httpx mock
]

[project.scripts]
bine = "bine.cli:main"
bine-mcp = "bine.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bine"]

[tool.vercel]
entrypoint = "bine.app:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
