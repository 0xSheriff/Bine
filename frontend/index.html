<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bine - Pre-Trade Guard for Tokenized Stocks on BSC</title>
    <script>
      ;(function () {
        try {
          var qTheme = new URLSearchParams(window.location.search).get('theme')
          var stored = localStorage.getItem('bine-theme')
          var theme =
            qTheme === 'light' || qTheme === 'dark'
              ? qTheme
              : stored === 'light' || stored === 'dark'
                ? stored
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          if (qTheme === 'light' || qTheme === 'dark') {
            localStorage.setItem('bine-theme', qTheme)
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
